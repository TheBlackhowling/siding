# Committed siding recipe. Slot names come from the checkout folder.
version: 1
project: hello
host: "{stack}.{project}.{mode}"
compose_project: "{project}-{stack}-{mode}"
slot_env_file: .siding/env

modes:
  test:
    compose_files:
      - docker-compose.yml
    ports:
      web: 18080
    port_env:
      web: WEB_PORT
    env:
      SIDING_DEMO: "1"
