# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: siding

before:
  hooks:
    - go mod tidy
    - go test ./...
    - bash scripts/verify-library.sh

builds:
  - id: siding
    main: ./cmd/siding
    binary: siding
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/TheBlackhowling/siding/internal/version.Version={{.Version}}
      - -X github.com/TheBlackhowling/siding/internal/version.Commit={{.Commit}}
      - -X github.com/TheBlackhowling/siding/internal/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

signs:
  - cmd: go
    args:
      - run
      - ./scripts/sign-checksums
      - "${artifact}"
    artifacts: checksum
    signature: "${artifact}.sig"
    # Inherit SIDING_CHECKSUM_SIGN_SEED from the goreleaser process (CI step env).
    # Do not template .Env here; custom secrets are not in GoReleaser's .Env map.

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  abbrev: 8
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^Merge pull request"
      - "^Merge branch"
      - "^Merge remote-tracking branch"

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - siding
      sign:
        certificate: '{{ envOrDefault "MACOS_SIGN_P12" "" }}'
        password: '{{ envOrDefault "MACOS_SIGN_PASSWORD" "" }}'
      notarize:
        issuer_id: '{{ envOrDefault "MACOS_NOTARY_ISSUER_ID" "" }}'
        key_id: '{{ envOrDefault "MACOS_NOTARY_KEY_ID" "" }}'
        key: '{{ envOrDefault "MACOS_NOTARY_KEY" "" }}'
        # Wait for Apple (max 20m JWT). Upload notarized darwin binaries so
        # Gatekeeper accepts quarantined downloads. Re-run Release if Apple is slow.
        wait: true
        timeout: 20m

release:
  github:
    owner: TheBlackhowling
    name: siding
  draft: true
  prerelease: auto
  header: |
    CLI binaries for this tag. Download the archive for your OS.

    The Go library (`github.com/TheBlackhowling/siding/siding`) ships at the
    **same tag** as these binaries - one `v*` tag, lockstep.
  footer: |
    ## Go library (same tag)

    Go CLIs can import the module at this version:

    ```go
    require github.com/TheBlackhowling/siding v{{ .Version }}

    import "github.com/TheBlackhowling/siding/siding"
    ```

    See `docs/LIBRARY.md` in this repo.
