name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Verify Go library release
        run: bash scripts/verify-library.sh

  goreleaser:
    needs: verify-library
    runs-on: ubuntu-latest
    env:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      SIDING_CHECKSUM_SIGN_SEED: ${{ secrets.SIDING_CHECKSUM_SIGN_SEED }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --timeout 3h
        env:
          # PAT with contents:write on TheBlackhowling/siding-releases.
          # GITHUB_TOKEN cannot create Releases on a different repo.
          GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
      - name: Verify macOS binaries are signed
        if: ${{ env.MACOS_SIGN_P12 != '' }}
        env:
          SIDING_DIST: dist
          SIDING_REQUIRE_SIGNED: "1"
        run: go test ./internal/signcheck -run TestDistBinariesSigned -count=1 -v
